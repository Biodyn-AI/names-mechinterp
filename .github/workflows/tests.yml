name: CPU reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the small CPU test environment
        run: python -m pip install -e ".[dev]"
      - name: Run tests without model or network access
        run: python -m pytest tests -q
      - name: Verify released file hashes and compressed originals
        run: python -m names_mechinterp.verify --verify-compressed
      - name: Reproduce released processed results
        run: python -m names_mechinterp.reproduce --data-root data/processed --output results/reproduced.json
