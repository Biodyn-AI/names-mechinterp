[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "names-mechinterp"
version = "0.1.0"
description = "Offline reproduction of an equivalent-name factual retrieval study"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Ihor Kendiukhov"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
paper = ["python-docx>=1.1,<2", "Pillow>=10,<13"]
# These are the original experiment versions, not default installation requirements.
# For the exact Linux CUDA wheel use requirements-gpu.txt instead of this extra.
gpu = [
  "torch==2.6.0",
  "transformers==5.14.1",
  "tokenizers==0.22.2",
  "numpy==2.5.1",
  "safetensors==0.8.0",
  "huggingface-hub==1.33.0",
]

[project.urls]
Repository = "https://github.com/Biodyn-AI/names-mechinterp"
Issues = "https://github.com/Biodyn-AI/names-mechinterp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
